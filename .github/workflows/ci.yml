name: Godot CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: godot-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install verified Godot 4.7.2
        run: python scripts/install_godot.py "$RUNNER_TEMP/godot"
      - name: Validate release packaging
        run: python -m unittest discover -s scripts/tests -p "test_release_package.py"
      - name: Import and run complete suite
        env:
          STRESS_TEST_BUDGET_SECONDS: '15'
        run: ./scripts/run_smoke_test.sh
      - name: Preserve test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-logs-${{ matrix.os }}
          path: .godot/*.output.log
          include-hidden-files: true

  build:
    name: Package desktop exports
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate release version
        shell: bash
        env:
          RELEASE_REF: ${{ github.ref_name }}
          REF_TYPE: ${{ github.ref_type }}
        run: |
          if [ "$REF_TYPE" = tag ]; then
            ./scripts/check_release_version.sh "${RELEASE_REF#v}"
          else
            ./scripts/check_release_version.sh
          fi
      - name: Install verified Godot and templates
        run: python scripts/install_godot.py "$RUNNER_TEMP/godot" --templates
      - name: Import and export release builds
        env:
          GODOT_EXPORT_MODE: release
        run: |
          "$GODOT_BIN" --headless --editor --path . --import --quit
          ./scripts/export_builds.sh
          python scripts/package_release.py
      - name: Upload versioned archives and checksums
        uses: actions/upload-artifact@v4
        with:
          name: desktop-release
          path: builds/release/*
          if-no-files-found: error

  native-smoke:
    name: Native export (${{ matrix.os }})
    needs: build
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          name: desktop-release
          path: builds/release
      - name: Verify checksum and start native packaged app
        run: python scripts/smoke_export.py builds/release

  release:
    name: Draft GitHub release
    if: github.ref_type == 'tag'
    needs: [test, build, native-smoke]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: desktop-release
          path: builds/release
      - name: Create or refresh reviewable release draft
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          if gh release view "$RELEASE_TAG" --json isDraft --jq .isDraft > /tmp/is-draft; then
            test "$(cat /tmp/is-draft)" = true
            gh release upload "$RELEASE_TAG" builds/release/* --clobber
          else
            gh release create "$RELEASE_TAG" builds/release/* --verify-tag --draft \
              --title "Radar Operator $RELEASE_TAG" --notes-file docs/release-notes.md
          fi
