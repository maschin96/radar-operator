name: Godot CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: godot-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Import and test
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Cache Godot
        id: godot-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/radar-operator/godot
          key: godot-4.7.2-linux-x86-64

      - name: Install Godot 4.7.2
        if: steps.godot-cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p "$HOME/.cache/radar-operator/godot"
          curl --fail --location --retry 3 \
            --output /tmp/godot.zip \
            https://github.com/godotengine/godot-builds/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip
          unzip -q /tmp/godot.zip -d "$HOME/.cache/radar-operator/godot"
          chmod +x "$HOME/.cache/radar-operator/godot/Godot_v4.7.2-stable_linux.x86_64"

      - name: Run complete test suite
        run: |
          chmod +x "$HOME/.cache/radar-operator/godot/Godot_v4.7.2-stable_linux.x86_64"
          GODOT_BIN="$HOME/.cache/radar-operator/godot/Godot_v4.7.2-stable_linux.x86_64" \
            ./scripts/run_smoke_test.sh
